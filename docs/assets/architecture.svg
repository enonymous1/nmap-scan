<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="240" fill="#ffffff"/>
  <g font-size="14" text-anchor="middle">
    <rect x="10" y="70" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#333"/>
    <text x="70" y="95">nmap-scan</text><text x="70" y="115">CLI</text>
    <rect x="160" y="70" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#333"/>
    <text x="220" y="95">profile</text><text x="220" y="115">validation</text>
    <rect x="310" y="70" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#333"/>
    <text x="370" y="95">python-</text><text x="370" y="115">nmap</text>
    <rect x="460" y="70" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#333"/>
    <text x="520" y="95">nmap</text><text x="520" y="115">binary</text>
    <rect x="610" y="70" width="120" height="60" rx="8" fill="#fff3cd" stroke="#333"/>
    <text x="670" y="95">XML file</text><text x="670" y="115">(primary record)</text>
    <rect x="760" y="70" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#333"/>
    <text x="820" y="95">parser</text><text x="820" y="115">(stdlib only)</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="100" x2="158" y2="100"/>
    <line x1="280" y1="100" x2="308" y2="100"/>
    <line x1="430" y1="100" x2="458" y2="100"/>
    <line x1="580" y1="100" x2="608" y2="100"/>
    <line x1="730" y1="100" x2="758" y2="100"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="610" y="160" width="120" height="30" rx="8" fill="#e2f3e5" stroke="#333"/>
    <text x="670" y="180">Markdown</text>
    <rect x="745" y="160" width="80" height="30" rx="8" fill="#e2f3e5" stroke="#333"/>
    <text x="785" y="180">JSON</text>
    <rect x="840" y="160" width="50" height="30" rx="8" fill="#e2f3e5" stroke="#333"/>
    <text x="865" y="180">CSV</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="820" y1="130" x2="700" y2="158"/>
    <line x1="820" y1="130" x2="785" y2="158"/>
    <line x1="820" y1="130" x2="865" y2="158"/>
  </g>
  <text x="450" y="30" font-size="15" text-anchor="middle">The XML file is the boundary between scanning and parsing.</text>
  <text x="450" y="220" font-size="15" text-anchor="middle">parse needs neither python-nmap nor the nmap binary.</text>
</svg>
